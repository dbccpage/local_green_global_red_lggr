[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "finite-authority-and-non-terminal-computation"
version = "2.0.3"
description = "Finite Authority and Non-Terminal Computation: Proposal Systems, Evaluated Path Kernels, and Structural Firewalls"
readme = "finite_authority_and_non_terminal_computation_monograph.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.setuptools]
package-dir = {"" = "code"}

[tool.pytest.ini_options]
testpaths = ["code/tests"]
pythonpath = ["code", "."]
addopts = "-p no:debugging"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
mypy_path = ["code"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
