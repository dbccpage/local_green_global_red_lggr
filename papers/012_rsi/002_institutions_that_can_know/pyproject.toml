[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "institutions-that-can-know"
version = "0.1.0"
description = "Exact finite recovery examples for Institutions That Can Know"
requires-python = ">=3.10"
authors = [{name = "Jeremy H. Carroll"}]
license = {file = "LICENSE-CODE"}
dependencies = []

[project.optional-dependencies]
contract = ["PyYAML>=6,<7"]
notebook = ["nbclient>=0.10,<1", "nbformat>=5,<6", "ipykernel>=6,<8"]
documents = ["PyMuPDF>=1.24,<2"]

[tool.setuptools]
py-modules = ["institutional_reasoning"]
package-dir = {"" = "code"}
