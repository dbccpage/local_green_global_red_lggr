[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "relational-reasoning-and-rsi-impossibility"
version = "1.2.3"
description = "Relational Reasoning, Memory, and Embedded Knowledge"
readme = "relational_reasoning_and_rsi_impossibility_monograph.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "jupyter>=1.0.0",
    "pypdf>=4.0.0",
]

[tool.setuptools]
package-dir = {"" = "code"}
packages = ["rsi_eis_resources"]
py-modules = ["communication_channels", "deposit_paths", "eis_verifier", "exact_dual_witness_solver", "finite_limits", "higher_cell_async_hypergraph", "memory_cli", "memory_machine", "multi_agent_hypergraph", "residual_memory", "rsi_transition_harness", "simplicial_complex", "simplicial_rewiring", "single_agent_graph"]

[tool.setuptools.package-data]
rsi_eis_resources = ["*.json", "*.rs"]

[project.scripts]
rsi-transitions = "rsi_transition_harness:main"
rsi-memory = "memory_cli:main"

[tool.pytest.ini_options]
testpaths = ["code/tests"]
pythonpath = ["code", "."]
addopts = "-p no:debugging"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
mypy_path = ["code"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
