[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "contextual_prediction_and_self_certification"
version = "1.8.3"
description = "Contextual prediction, observation fibers, ledger checks, and provenance policies: RSI companion paper"
authors = [{ name = "Jeremy H. Carroll" }]
license = { text = "PolyForm-Noncommercial-1.0.0" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[tool.pytest.ini_options]
testpaths = ["code/tests"]
addopts = "-q --strict-markers"

[tool.setuptools]
py-modules = []
