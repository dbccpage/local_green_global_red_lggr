[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "role-non-impersonation-and-authority-preservation"
version = "1.3.0"
description = "The Omega Tower: Role Non-Impersonation and Authority Preservation in Agentic AI"
readme = "role_non_impersonation_and_authority_preservation.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.setuptools]
package-dir = {"" = "code"}

[tool.pytest.ini_options]
testpaths = ["code/tests"]
pythonpath = ["code", "."]
addopts = "-p no:debugging -p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py312"
cache-dir = "~/.cache/ruff"

[tool.mypy]
mypy_path = ["code"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
