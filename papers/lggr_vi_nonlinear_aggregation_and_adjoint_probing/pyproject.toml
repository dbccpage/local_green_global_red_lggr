[project]
name = "lggr-vi-adjoint-probing"
version = "0.1.1"
description = "Finite observation blind spots and adjoint probes"
authors = [{ name = "Jeremy H. Carroll" }]
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
keywords = [
    "observation-operator",
    "kernel",
    "nonlinear-aggregation",
    "adjoint-probing",
    "formal-verification",
    "lean4",
]
dependencies = [
    "matplotlib==3.10.8",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "code"}
py-modules = ["lggr_vi_core", "generate_figures"]

[tool.pytest.ini_options]
testpaths = ["code/tests"]
pythonpath = ["code"]
addopts = "--dist=loadgroup -ra -q"
markers = [
    "xdist_group(name): serialize notebook kernels on Windows",
]
filterwarnings = [
    "error",
    "ignore:Proactor event loop does not implement add_reader.*:RuntimeWarning:zmq._future",
    "ignore:.*asyncio.*:DeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["lggr_vi_core", "generate_figures"]

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.uv]
constraint-dependencies = ["pillow>=13.0.0"]
