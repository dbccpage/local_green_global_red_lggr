[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "epk-org-gluing"
version = "1.3.1"
description = "Finite Boolean evaluator composition with Lean 4 checks"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "Jeremy H. Carroll" }
]
keywords = [
    "evaluator-composition",
    "local-to-global",
    "boolean-defect",
    "formal-verification",
    "lean4",
    "reproducible-research"
]
dependencies = [
    "numpy>=1.24.0",
    "matplotlib>=3.7.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.6.0",
    "nbclient>=0.8.0",
    "nbformat>=5.9.0",
    "ipykernel>=6.29.0",
    "ipywidgets>=8.0.0"
]

[tool.setuptools]
package-dir = {"" = "code"}
py-modules = ["organizational_gluing_core", "generate_figures"]

[tool.pytest.ini_options]
testpaths = ["code/tests"]
pythonpath = ["code"]

[tool.uv]
constraint-dependencies = ["pillow>=13.0.0"]
