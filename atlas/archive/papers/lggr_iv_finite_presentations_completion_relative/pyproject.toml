[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lggr-iv-finite-presentations"
version = "0.1.1"
description = "Finite-Stage Solvability and Completion-Relative Obstruction"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "Jeremy H. Carroll" }
]
keywords = [
    "finite-presentations",
    "inverse-limits",
    "adic-completion",
    "obstruction-calculus",
    "formal-verification",
    "lean4",
    "reproducible-research"
]
dependencies = [
    "numpy>=1.24.0",
    "matplotlib>=3.7.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.6.0"
]

[tool.setuptools]
package-dir = {"" = "code"}
py-modules = ["lggr_iv_core", "generate_figures"]

[tool.pytest.ini_options]
testpaths = ["code/tests"]
pythonpath = ["code"]
