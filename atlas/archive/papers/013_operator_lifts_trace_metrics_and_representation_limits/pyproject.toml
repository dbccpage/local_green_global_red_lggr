[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omega-paper-013-operator-lifts"
version = "2.1.1"
description = "Operator Lifts Trace Metrics and Representation Limits"
readme = "README.md"
license = { text = "Apache-2.0 OR MIT" }
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.0"
]

[tool.pytest.ini_options]
testpaths = ["code/tests"]
python_files = ["test_*.py"]
