[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-026-operator-proposals"
version = "2.0.5"
description = "Proposal selection and continuation-stable diagnostics on finite graphs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.3,<10"]

[tool.setuptools]
package-dir = {"" = "code"}
py-modules = ["mod_operator_proposal_core", "deposit_paths"]

[tool.pytest.ini_options]
testpaths = ["code/tests"]
pythonpath = ["code"]

[tool.ruff]
target-version = "py312"
line-length = 100
