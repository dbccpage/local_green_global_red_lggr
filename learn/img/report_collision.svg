<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" role="img" aria-labelledby="t d">
<title id="t">Report collision</title>
<desc id="d">Left: two tasks needing different approval tiers send the same summary, so the fiber monitor returns REPORT_INSUFFICIENT with the colliding pair. Right: adding approval_tier to the report puts each task in its own fiber and the monitor returns DECODER_VERIFIED.</desc>
<style>
  .bg{fill:#ffffff} .panel{fill:#f6f8fa;stroke:#d0d7de} .ink{fill:#1f2328} .muted{fill:#59636e}
  .g{fill:#dafbe1;stroke:#1a7f37} .gt{fill:#1a7f37} .r{fill:#ffebe9;stroke:#cf222e} .rt{fill:#cf222e}
  .b{fill:#ddf4ff;stroke:#0969da} .bt{fill:#0969da} .a{fill:#fff8c5;stroke:#9a6700} .at{fill:#9a6700}
  .line{stroke:#59636e;fill:none} .al{stroke:#9a6700;fill:none} .gl{stroke:#1a7f37;fill:none} .rl{stroke:#cf222e;fill:none} .bl{stroke:#0969da;fill:none}
  .head{fill:#59636e} .ghead{fill:#1a7f37} .rhead{fill:#cf222e} .bhead{fill:#0969da}
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:14px}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
  .h{font-size:15px;font-weight:600} .s{font-size:12.5px} .cap{font-size:13px}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d1117} .panel{fill:#151b23;stroke:#3d444d} .ink{fill:#e6edf3} .muted{fill:#9198a1}
    .g{fill:#0f2a1a;stroke:#3fb950} .gt{fill:#3fb950} .r{fill:#3a1418;stroke:#f85149} .rt{fill:#f85149}
    .b{fill:#0c2340;stroke:#4493f8} .bt{fill:#4493f8} .a{fill:#2e2405;stroke:#d29922} .at{fill:#d29922}
    .line{stroke:#9198a1} .al{stroke:#d29922} .gl{stroke:#3fb950} .rl{stroke:#f85149} .bl{stroke:#4493f8}
    .head{fill:#9198a1} .ghead{fill:#3fb950} .rhead{fill:#f85149} .bhead{fill:#4493f8}
  }
</style>
<defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ghead"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="rhead"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="bhead"/></marker></defs>
<rect class="bg" width="800" height="340" rx="8"/>
<rect x="20" y="20" width="370" height="300" rx="8" class="panel" stroke-width="1.5"/>
<rect x="410" y="20" width="370" height="300" rx="8" class="panel" stroke-width="1.5"/>
<text x="205" y="46" class="ink h" text-anchor="middle">Thin report: one fiber</text>
<text x="595" y="46" class="ink h" text-anchor="middle">Enriched report: two fibers</text>
<rect x="40" y="70" width="130" height="48" rx="8" class="panel" stroke-width="1.5"/>
<rect x="40" y="150" width="130" height="48" rx="8" class="panel" stroke-width="1.5"/>
<text x="105" y="90" class="ink" text-anchor="middle">task-a</text>
<text x="105" y="107" class="muted s" text-anchor="middle">needs tier 3</text>
<text x="105" y="170" class="ink" text-anchor="middle">task-b</text>
<text x="105" y="187" class="muted s" text-anchor="middle">needs tier 1</text>
<rect x="225" y="105" width="145" height="58" rx="8" class="r" stroke-width="1.5"/>
<text x="297" y="128" class="mono ink" text-anchor="middle">&quot;ship the etl job&quot;</text>
<text x="297" y="146" class="rt s" text-anchor="middle">same report</text>
<line x1="170" y1="94" x2="223" y2="124" class="rl" stroke-width="1.6" marker-end="url(#mr)"/>
<line x1="170" y1="174" x2="223" y2="146" class="rl" stroke-width="1.6" marker-end="url(#mr)"/>
<text x="205" y="240" class="rt mono" text-anchor="middle">REPORT_INSUFFICIENT</text>
<text x="205" y="260" class="ink s" text-anchor="middle">colliding_pair: task-a, task-b</text>
<text x="205" y="280" class="muted s" text-anchor="middle">next agent cannot tell which tier</text>
<rect x="430" y="70" width="130" height="48" rx="8" class="panel" stroke-width="1.5"/>
<rect x="430" y="150" width="130" height="48" rx="8" class="panel" stroke-width="1.5"/>
<text x="495" y="90" class="ink" text-anchor="middle">task-a</text>
<text x="495" y="107" class="muted s" text-anchor="middle">needs tier 3</text>
<text x="495" y="170" class="ink" text-anchor="middle">task-b</text>
<text x="495" y="187" class="muted s" text-anchor="middle">needs tier 1</text>
<rect x="605" y="70" width="160" height="48" rx="8" class="g" stroke-width="1.5"/>
<rect x="605" y="150" width="160" height="48" rx="8" class="g" stroke-width="1.5"/>
<text x="685" y="90" class="mono ink" text-anchor="middle">&quot;ship…&quot;, tier 3</text>
<text x="685" y="107" class="gt s" text-anchor="middle">own fiber</text>
<text x="685" y="170" class="mono ink" text-anchor="middle">&quot;ship…&quot;, tier 1</text>
<text x="685" y="187" class="gt s" text-anchor="middle">own fiber</text>
<line x1="560" y1="94" x2="603" y2="94" class="gl" stroke-width="1.6" marker-end="url(#mg)"/>
<line x1="560" y1="174" x2="603" y2="174" class="gl" stroke-width="1.6" marker-end="url(#mg)"/>
<text x="595" y="240" class="gt mono" text-anchor="middle">DECODER_VERIFIED</text>
<text x="595" y="260" class="ink s" text-anchor="middle">fix: add approval_tier to the report</text>
<text x="595" y="280" class="muted s" text-anchor="middle">certified on these rows only</text>
</svg>
