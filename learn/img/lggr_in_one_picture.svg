<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" role="img" aria-labelledby="t d">
<title id="t">Local green, global red</title>
<desc id="d">Three agents each pass their local check, but the end-to-end check fails because the reports between them dropped a field the global question needs.</desc>
<style>
  .bg{fill:#ffffff} .panel{fill:#f6f8fa;stroke:#d0d7de} .ink{fill:#1f2328} .muted{fill:#59636e}
  .g{fill:#dafbe1;stroke:#1a7f37} .gt{fill:#1a7f37} .r{fill:#ffebe9;stroke:#cf222e} .rt{fill:#cf222e}
  .b{fill:#ddf4ff;stroke:#0969da} .bt{fill:#0969da} .a{fill:#fff8c5;stroke:#9a6700} .at{fill:#9a6700}
  .line{stroke:#59636e;fill:none} .al{stroke:#9a6700;fill:none} .gl{stroke:#1a7f37;fill:none} .rl{stroke:#cf222e;fill:none} .bl{stroke:#0969da;fill:none}
  .head{fill:#59636e} .ghead{fill:#1a7f37} .rhead{fill:#cf222e} .bhead{fill:#0969da}
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:14px}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
  .h{font-size:15px;font-weight:600} .s{font-size:12.5px} .cap{font-size:13px}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d1117} .panel{fill:#151b23;stroke:#3d444d} .ink{fill:#e6edf3} .muted{fill:#9198a1}
    .g{fill:#0f2a1a;stroke:#3fb950} .gt{fill:#3fb950} .r{fill:#3a1418;stroke:#f85149} .rt{fill:#f85149}
    .b{fill:#0c2340;stroke:#4493f8} .bt{fill:#4493f8} .a{fill:#2e2405;stroke:#d29922} .at{fill:#d29922}
    .line{stroke:#9198a1} .al{stroke:#d29922} .gl{stroke:#3fb950} .rl{stroke:#f85149} .bl{stroke:#4493f8}
    .head{fill:#9198a1} .ghead{fill:#3fb950} .rhead{fill:#f85149} .bhead{fill:#4493f8}
  }
</style>
<defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ghead"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="rhead"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="bhead"/></marker></defs>
<rect class="bg" width="800" height="320" rx="8"/>
<rect x="40" y="40" width="200" height="74" rx="8" class="g" stroke-width="1.5"/>
<text x="140" y="68" class="ink h" text-anchor="middle">Planner</text>
<text x="140" y="87" class="gt s" text-anchor="middle">spec review: pass</text>
<line x1="240" y1="77" x2="298" y2="77" class="line" stroke-width="1.6" marker-end="url(#m)"/>
<text x="269" y="68" class="muted s" text-anchor="middle">report</text>
<rect x="300" y="40" width="200" height="74" rx="8" class="g" stroke-width="1.5"/>
<text x="400" y="68" class="ink h" text-anchor="middle">Implementer</text>
<text x="400" y="87" class="gt s" text-anchor="middle">unit tests: pass</text>
<line x1="500" y1="77" x2="558" y2="77" class="line" stroke-width="1.6" marker-end="url(#m)"/>
<text x="529" y="68" class="muted s" text-anchor="middle">report</text>
<rect x="560" y="40" width="200" height="74" rx="8" class="g" stroke-width="1.5"/>
<text x="660" y="68" class="ink h" text-anchor="middle">Verifier</text>
<text x="660" y="87" class="gt s" text-anchor="middle">local suite: pass</text>
<rect x="200" y="196" width="400" height="74" rx="8" class="r" stroke-width="1.5"/>
<text x="400" y="226" class="rt h" text-anchor="middle">End-to-end check: fail</text>
<text x="400" y="245" class="ink s" text-anchor="middle">ΔE = −1   local green, global red</text>
<line x1="140" y1="116" x2="330" y2="194" class="rl" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#mr)"/>
<line x1="400" y1="116" x2="400" y2="194" class="rl" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#mr)"/>
<line x1="660" y1="116" x2="470" y2="194" class="rl" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#mr)"/>
<text x="400" y="300" class="muted cap" text-anchor="middle">Every handoff passed its own check. The global answer depended on a field no report carried.</text>
</svg>
