<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" width="800" height="390" role="img" aria-labelledby="t d">
<title id="t">Authority firewall</title>
<desc id="d">The proposer lane can propose steps but cannot change the policy or supply the global sample. A witness built under a loosened policy yields AUTHORITY_REQUIRED; a self-signed sample yields GLOBAL_SAMPLE_REJECTED. The host freezes the policy, builds witnesses, and takes the sample from an external check.</desc>
<style>
  .bg{fill:#ffffff} .panel{fill:#f6f8fa;stroke:#d0d7de} .ink{fill:#1f2328} .muted{fill:#59636e}
  .g{fill:#dafbe1;stroke:#1a7f37} .gt{fill:#1a7f37} .r{fill:#ffebe9;stroke:#cf222e} .rt{fill:#cf222e}
  .b{fill:#ddf4ff;stroke:#0969da} .bt{fill:#0969da} .a{fill:#fff8c5;stroke:#9a6700} .at{fill:#9a6700}
  .line{stroke:#59636e;fill:none} .al{stroke:#9a6700;fill:none} .gl{stroke:#1a7f37;fill:none} .rl{stroke:#cf222e;fill:none} .bl{stroke:#0969da;fill:none}
  .head{fill:#59636e} .ghead{fill:#1a7f37} .rhead{fill:#cf222e} .bhead{fill:#0969da}
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:14px}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
  .h{font-size:15px;font-weight:600} .s{font-size:12.5px} .cap{font-size:13px}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d1117} .panel{fill:#151b23;stroke:#3d444d} .ink{fill:#e6edf3} .muted{fill:#9198a1}
    .g{fill:#0f2a1a;stroke:#3fb950} .gt{fill:#3fb950} .r{fill:#3a1418;stroke:#f85149} .rt{fill:#f85149}
    .b{fill:#0c2340;stroke:#4493f8} .bt{fill:#4493f8} .a{fill:#2e2405;stroke:#d29922} .at{fill:#d29922}
    .line{stroke:#9198a1} .al{stroke:#d29922} .gl{stroke:#3fb950} .rl{stroke:#f85149} .bl{stroke:#4493f8}
    .head{fill:#9198a1} .ghead{fill:#3fb950} .rhead{fill:#f85149} .bhead{fill:#4493f8}
  }
</style>
<defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ghead"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="rhead"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="bhead"/></marker></defs>
<rect class="bg" width="800" height="390" rx="8"/>
<rect x="20" y="20" width="760" height="120" rx="8" class="a" stroke-width="1.5"/>
<rect x="20" y="170" width="760" height="200" rx="8" class="panel" stroke-width="1.5"/>
<text x="40" y="46" class="at h" text-anchor="start">Proposer lane: agents</text>
<text x="40" y="196" class="ink h" text-anchor="start">Host lane: your harness</text>
<rect x="40" y="62" width="200" height="60" rx="8" class="r" stroke-width="1.5"/>
<text x="140" y="85" class="ink s" text-anchor="middle">raise max_total 1 → 2</text>
<text x="140" y="103" class="rt s" text-anchor="middle">loosened policy</text>
<rect x="290" y="62" width="200" height="60" rx="8" class="panel" stroke-width="1.5"/>
<text x="390" y="85" class="ink s" text-anchor="middle">propose before → after</text>
<text x="390" y="103" class="muted s" text-anchor="middle">normal step</text>
<rect x="540" y="62" width="220" height="60" rx="8" class="r" stroke-width="1.5"/>
<text x="650" y="85" class="ink s" text-anchor="middle">&quot;tests passed&quot; from itself</text>
<text x="650" y="103" class="rt s" text-anchor="middle">self-signed global sample</text>
<rect x="40" y="215" width="200" height="62" rx="8" class="b" stroke-width="1.5"/>
<text x="140" y="238" class="ink s" text-anchor="middle">BudgetPolicy (frozen)</text>
<text x="140" y="256" class="bt s" text-anchor="middle">sha256 pinned</text>
<rect x="290" y="215" width="200" height="62" rx="8" class="b" stroke-width="1.5"/>
<text x="390" y="238" class="ink s" text-anchor="middle">make_witness (host)</text>
<text x="390" y="256" class="bt s" text-anchor="middle">StreamingAuditMonitor</text>
<rect x="540" y="215" width="220" height="62" rx="8" class="b" stroke-width="1.5"/>
<text x="650" y="238" class="ink s" text-anchor="middle">external e2e check</text>
<text x="650" y="256" class="bt s" text-anchor="middle">global_evaluator_sample</text>
<line x1="390" y1="124" x2="390" y2="213" class="line" stroke-width="1.6" marker-end="url(#m)"/>
<line x1="240" y1="246" x2="288" y2="246" class="bl" stroke-width="1.6" marker-end="url(#mb)"/>
<line x1="540" y1="246" x2="492" y2="246" class="bl" stroke-width="1.6" marker-end="url(#mb)"/>
<line x1="140" y1="124" x2="140" y2="158" class="rl" stroke-width="1.6" stroke-dasharray="5 4"/>
<line x1="126" y1="160" x2="154" y2="160" class="rl" stroke-width="3"/>
<text x="162" y="164" class="rt mono" text-anchor="start">AUTHORITY_REQUIRED</text>
<line x1="650" y1="124" x2="650" y2="158" class="rl" stroke-width="1.6" stroke-dasharray="5 4"/>
<line x1="636" y1="160" x2="664" y2="160" class="rl" stroke-width="3"/>
<text x="628" y="164" class="rt mono" text-anchor="end">GLOBAL_SAMPLE_REJECTED</text>
<rect x="165" y="300" width="450" height="54" rx="8" class="panel" stroke-width="1.5"/>
<text x="390" y="322" class="ink s" text-anchor="middle">Receipt + unresolved_obligations = evidence, never permission.</text>
<text x="390" y="340" class="muted s" text-anchor="middle">Merge, deploy, or spend needs a separate external admission.</text>
</svg>
