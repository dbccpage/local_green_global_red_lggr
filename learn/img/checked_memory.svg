<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350" role="img" aria-labelledby="t d">
<title id="t">Checked memory</title>
<desc id="d">A memory record stores source, contract, and representation hashes. On recall each record is labelled TRANSPORT_REQUIRED, STALE_CONTRACT, STALE_SOURCE, CONFLICT, or FRESH, and every open obligation is returned.</desc>
<style>
  .bg{fill:#ffffff} .panel{fill:#f6f8fa;stroke:#d0d7de} .ink{fill:#1f2328} .muted{fill:#59636e}
  .g{fill:#dafbe1;stroke:#1a7f37} .gt{fill:#1a7f37} .r{fill:#ffebe9;stroke:#cf222e} .rt{fill:#cf222e}
  .b{fill:#ddf4ff;stroke:#0969da} .bt{fill:#0969da} .a{fill:#fff8c5;stroke:#9a6700} .at{fill:#9a6700}
  .line{stroke:#59636e;fill:none} .al{stroke:#9a6700;fill:none} .gl{stroke:#1a7f37;fill:none} .rl{stroke:#cf222e;fill:none} .bl{stroke:#0969da;fill:none}
  .head{fill:#59636e} .ghead{fill:#1a7f37} .rhead{fill:#cf222e} .bhead{fill:#0969da}
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:14px}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
  .h{font-size:15px;font-weight:600} .s{font-size:12.5px} .cap{font-size:13px}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d1117} .panel{fill:#151b23;stroke:#3d444d} .ink{fill:#e6edf3} .muted{fill:#9198a1}
    .g{fill:#0f2a1a;stroke:#3fb950} .gt{fill:#3fb950} .r{fill:#3a1418;stroke:#f85149} .rt{fill:#f85149}
    .b{fill:#0c2340;stroke:#4493f8} .bt{fill:#4493f8} .a{fill:#2e2405;stroke:#d29922} .at{fill:#d29922}
    .line{stroke:#9198a1} .al{stroke:#d29922} .gl{stroke:#3fb950} .rl{stroke:#f85149} .bl{stroke:#4493f8}
    .head{fill:#9198a1} .ghead{fill:#3fb950} .rhead{fill:#f85149} .bhead{fill:#4493f8}
  }
</style>
<defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ghead"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="rhead"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="bhead"/></marker></defs>
<rect class="bg" width="800" height="350" rx="8"/>
<rect x="20" y="20" width="250" height="300" rx="8" class="panel" stroke-width="1.5"/>
<text x="145" y="46" class="ink h" text-anchor="middle">Write</text>
<rect x="40" y="62" width="210" height="160" rx="8" class="b" stroke-width="1.5"/>
<text x="55" y="84" class="mono ink" text-anchor="start">key: pricing.output_key</text>
<text x="55" y="106" class="mono ink" text-anchor="start">content: net_cents</text>
<text x="55" y="128" class="mono ink" text-anchor="start">source_ref: pricing.py</text>
<text x="55" y="150" class="mono bt" text-anchor="start">source_sha256</text>
<text x="55" y="172" class="mono bt" text-anchor="start">contract_sha256</text>
<text x="55" y="194" class="mono bt" text-anchor="start">representation_id</text>
<rect x="40" y="240" width="210" height="62" rx="8" class="a" stroke-width="1.5"/>
<text x="145" y="263" class="at s" text-anchor="middle">obligation:</text>
<text x="145" y="282" class="mono ink" text-anchor="middle">recheck tax_engine</text>
<text x="510" y="46" class="ink h" text-anchor="middle">Recall: every record is labelled, never dropped</text>
<rect x="300" y="66" width="250" height="40" rx="8" class="panel" stroke-width="1.5"/>
<text x="425" y="91" class="ink s" text-anchor="middle">representation_id matches?</text>
<line x1="550" y1="86" x2="618" y2="86" class="rl" stroke-width="1.6" marker-end="url(#mr)"/>
<text x="584" y="80" class="rt s" text-anchor="middle">no</text>
<rect x="620" y="66" width="160" height="40" rx="8" class="r" stroke-width="1.5"/>
<text x="700" y="91" class="rt mono" text-anchor="middle">TRANSPORT_REQUIRED</text>
<line x1="425" y1="106" x2="425" y2="120" class="gl" stroke-width="1.6" marker-end="url(#mg)"/>
<rect x="300" y="122" width="250" height="40" rx="8" class="panel" stroke-width="1.5"/>
<text x="425" y="147" class="ink s" text-anchor="middle">contract hash matches?</text>
<line x1="550" y1="142" x2="618" y2="142" class="rl" stroke-width="1.6" marker-end="url(#mr)"/>
<text x="584" y="136" class="rt s" text-anchor="middle">no</text>
<rect x="620" y="122" width="160" height="40" rx="8" class="r" stroke-width="1.5"/>
<text x="700" y="147" class="rt mono" text-anchor="middle">STALE_CONTRACT</text>
<line x1="425" y1="162" x2="425" y2="176" class="gl" stroke-width="1.6" marker-end="url(#mg)"/>
<rect x="300" y="178" width="250" height="40" rx="8" class="panel" stroke-width="1.5"/>
<text x="425" y="203" class="ink s" text-anchor="middle">source hash matches?</text>
<line x1="550" y1="198" x2="618" y2="198" class="rl" stroke-width="1.6" marker-end="url(#mr)"/>
<text x="584" y="192" class="rt s" text-anchor="middle">no</text>
<rect x="620" y="178" width="160" height="40" rx="8" class="r" stroke-width="1.5"/>
<text x="700" y="203" class="rt mono" text-anchor="middle">STALE_SOURCE</text>
<line x1="425" y1="218" x2="425" y2="232" class="gl" stroke-width="1.6" marker-end="url(#mg)"/>
<rect x="300" y="234" width="250" height="40" rx="8" class="panel" stroke-width="1.5"/>
<text x="425" y="259" class="ink s" text-anchor="middle">no other fresh record disagrees?</text>
<line x1="550" y1="254" x2="618" y2="254" class="rl" stroke-width="1.6" marker-end="url(#mr)"/>
<text x="584" y="248" class="rt s" text-anchor="middle">no</text>
<rect x="620" y="234" width="160" height="40" rx="8" class="r" stroke-width="1.5"/>
<text x="700" y="259" class="rt mono" text-anchor="middle">CONFLICT</text>
<line x1="425" y1="274" x2="425" y2="290" class="gl" stroke-width="1.6" marker-end="url(#mg)"/>
<text x="436" y="282" class="gt s" text-anchor="start">yes</text>
<rect x="340" y="292" width="170" height="40" rx="8" class="g" stroke-width="1.5"/>
<text x="425" y="317" class="gt mono" text-anchor="middle">FRESH</text>
<rect x="530" y="292" width="250" height="40" rx="8" class="a" stroke-width="1.5"/>
<text x="655" y="317" class="at s" text-anchor="middle">+ every open obligation</text>
</svg>
