<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 290" width="800" height="290" role="img" aria-labelledby="t d">
<title id="t">Prefix is not endpoint</title>
<desc id="d">The path 0, 1, 2, 1 with bound 1 ends within the bound, so the endpoint query passes, but the running total reaches 2 at step 2, so the every-prefix query raises an alert.</desc>
<style>
  .bg{fill:#ffffff} .panel{fill:#f6f8fa;stroke:#d0d7de} .ink{fill:#1f2328} .muted{fill:#59636e}
  .g{fill:#dafbe1;stroke:#1a7f37} .gt{fill:#1a7f37} .r{fill:#ffebe9;stroke:#cf222e} .rt{fill:#cf222e}
  .b{fill:#ddf4ff;stroke:#0969da} .bt{fill:#0969da} .a{fill:#fff8c5;stroke:#9a6700} .at{fill:#9a6700}
  .line{stroke:#59636e;fill:none} .al{stroke:#9a6700;fill:none} .gl{stroke:#1a7f37;fill:none} .rl{stroke:#cf222e;fill:none} .bl{stroke:#0969da;fill:none}
  .head{fill:#59636e} .ghead{fill:#1a7f37} .rhead{fill:#cf222e} .bhead{fill:#0969da}
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:14px}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
  .h{font-size:15px;font-weight:600} .s{font-size:12.5px} .cap{font-size:13px}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d1117} .panel{fill:#151b23;stroke:#3d444d} .ink{fill:#e6edf3} .muted{fill:#9198a1}
    .g{fill:#0f2a1a;stroke:#3fb950} .gt{fill:#3fb950} .r{fill:#3a1418;stroke:#f85149} .rt{fill:#f85149}
    .b{fill:#0c2340;stroke:#4493f8} .bt{fill:#4493f8} .a{fill:#2e2405;stroke:#d29922} .at{fill:#d29922}
    .line{stroke:#9198a1} .al{stroke:#d29922} .gl{stroke:#3fb950} .rl{stroke:#f85149} .bl{stroke:#4493f8}
    .head{fill:#9198a1} .ghead{fill:#3fb950} .rhead{fill:#f85149} .bhead{fill:#4493f8}
  }
</style>
<defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ghead"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="rhead"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="bhead"/></marker></defs>
<rect class="bg" width="800" height="290" rx="8"/>
<text x="30" y="36" class="ink h" text-anchor="start">Path 0 → 1 → 2 → 1, bound 1 on the signed total</text>
<line x1="90" y1="250" x2="580" y2="250" class="line" stroke-width="1"/>
<line x1="90" y1="250" x2="90" y2="60" class="line" stroke-width="1"/>
<text x="78" y="255" class="muted s" text-anchor="end">0</text>
<text x="78" y="175" class="muted s" text-anchor="end">1</text>
<text x="78" y="95" class="muted s" text-anchor="end">2</text>
<text x="90" y="272" class="muted s" text-anchor="middle">step 0</text>
<text x="240" y="272" class="muted s" text-anchor="middle">step 1</text>
<text x="390" y="272" class="muted s" text-anchor="middle">step 2</text>
<text x="540" y="272" class="muted s" text-anchor="middle">step 3</text>
<line x1="90" y1="170" x2="580" y2="170" class="al" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="584" y="174" class="at s" text-anchor="start">bound</text>
<polyline points="90,250 240,170 390,90 540,170" class="bl" stroke-width="2.5"/>
<circle cx="90" cy="250" r="6" class="bt"/>
<circle cx="240" cy="170" r="6" class="bt"/>
<circle cx="390" cy="90" r="6" class="rt"/>
<circle cx="540" cy="170" r="6" class="gt"/>
<text x="390" y="76" class="rt s" text-anchor="middle">prefix total 2 &gt; 1</text>
<rect x="560" y="60" width="220" height="70" rx="8" class="g" stroke-width="1.5"/>
<text x="670" y="84" class="mono ink" text-anchor="middle">endpoint</text>
<text x="670" y="106" class="gt s" text-anchor="middle">|1 − 0| = 1 ≤ 1: pass</text>
<rect x="560" y="150" width="220" height="70" rx="8" class="r" stroke-width="1.5"/>
<text x="670" y="174" class="mono ink" text-anchor="middle">every_prefix</text>
<text x="670" y="196" class="rt s" text-anchor="middle">step 2 breaches: ALERT</text>
</svg>
