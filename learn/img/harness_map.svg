<text x="300" y="242" class="muted s" text-anchor="middle">guide 02</text>
<path d="M 485 122 C 485 155, 495 150, 495 186" class="bl" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#mb)"/>
