<line x1="260" y1="95" x2="288" y2="95" class="line" stroke-width="1.6" marker-end="url(#m)"/>
<line x1="400" y1="95" x2="428" y2="95" class="line" stroke-width="1.6" marker-end="url(#m)"/>
