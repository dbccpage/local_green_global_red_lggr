<text x="300" y="336" class="at s" text-anchor="middle">supplies global sample</text>
<line x1="300" y1="296" x2="300" y2="256" class="line" stroke-width="1.6" marker-end="url(#m)"/>
<rect x="420" y="296" width="360" height="56" rx="8" class="panel" stroke-width="1.5"/>
<text x="600" y="318" class="ink s" text-anchor="middle">Receipts are evidence. The merge gate stays</text>
<text x="600" y="336" class="ink s" text-anchor="middle">with the host and an external admission.</text>
<text x="400" y="384" class="muted cap" text-anchor="middle">Each tap emits one event from learn/HARNESS_CONTRACT.md. The proposer never feeds the external check.</text>
