name: derivations

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust derivation kernels, examples, receipts, event chains, DAG integrity
        working-directory: code/rust
        run: cargo test --locked

  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan (toolchain from lean4/lean-toolchain)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          bash elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: lake build (zero sorry enforced by the build and by cargo test)
        working-directory: lean4
        run: lake build
      - name: Axiom census against dag/derivations/derivation_dag.json
        run: |
          cargo run -q --locked --manifest-path code/rust/Cargo.toml --bin lean_census -- emit > lean4/Census.lean
          (cd lean4 && lake env lean Census.lean) > census.txt
          cargo run -q --locked --manifest-path code/rust/Cargo.toml --bin lean_census -- check < census.txt

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python app tests (outside the derivation path)
        run: python -m unittest discover -s tests
